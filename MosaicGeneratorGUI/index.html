<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosaic Generator</title>
    <script>
      // Apply the saved theme (dark unless "light" was chosen) before the page draws.
      // Keep the key in sync with src/theme.ts.
      try {
        if (localStorage.getItem("mosaic-generator.theme") !== "light") document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
